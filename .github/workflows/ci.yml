name: CI

# Every PR and every push to main runs the checks on GitHub-hosted runners.
# Only a push to main that passes all of them reaches the deploy job, which runs
# on the self-hosted runner on the Mac mini. PR code never touches that box:
# this repo is public, so a fork's PR must not run on a self-hosted runner.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish, so a deploy
  # is never cut off halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.3.14

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # next-env.d.ts and .next/types are gitignored. Without them a clean
      # checkout can't resolve image imports or Next's LayoutProps.
      - run: bunx next typegen
      - run: bunx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The production image is the real build: its build stage runs
      # `npm run build` (next build) on node:22, exactly as deploy does.
      - run: docker build --tag bangkoktor-frontend:ci .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Fails on high or critical. Moderate and low are printed, not fatal.
      - run: bun audit --audit-level=high

  deploy:
    needs: [lint, test, build, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    env:
      PROD_DIR: /Users/munyinsam/Prod/csp/BangkokTOR-frontend
    steps:
      - name: Pull latest in prod checkout
        run: git -C "$PROD_DIR" pull --ff-only

      # --wait blocks until the container is running (healthy, if a
      # HEALTHCHECK is added later), so a crash on boot fails the job.
      - name: Docker compose up
        working-directory: ${{ env.PROD_DIR }}
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Show running services
        if: always()
        working-directory: ${{ env.PROD_DIR }}
        run: docker compose ps

      - name: Prune dangling images
        run: docker image prune -f
